      <rect y="200" width="174" height="70" rx="12" fill="#0c0714" fill-opacity="0.85"/>
      <text x="14" y="226" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">Onigashima Moon</text>
      <text x="14" y="244" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10">3840 × 2160 • 4K</text>
      <rect x="14" y="250" width="46" height="14" rx="4" fill="#D97706"/>
      <text x="37" y="260" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">R2 CDN</text>
